name: A11y Check

# サイトを Jekyll でビルドし，pa11y（WCAG2AA）で自動検査する．
# 検査対象はトップページと books/ 配下の全ページ．

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Build site
        # actions/jekyll-build-pages v1.0.9
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: .
          destination: ./_site

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Serve and run pa11y
        run: |
          mkdir -p serve
          cp -r _site serve/errata
          npx --yes http-server serve -p 8080 --silent &
          sleep 3
          URLS="http://localhost:8080/errata/"
          if [ -d _site/books ]; then
            for f in $(find _site/books -name index.html); do
              rel="${f#_site/}"
              URLS="$URLS http://localhost:8080/errata/${rel%index.html}"
            done
          fi
          echo "checking: $URLS"
          npx --yes pa11y-ci $URLS
